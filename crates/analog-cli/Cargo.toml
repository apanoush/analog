[package]
name = "analog-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
repository = "https://github.com/apanoush/analog"

[package.metadata.wix]
upgrade-guid = "31EC38A9-5429-4F12-B574-B80BB9AF5CDC"
path-guid = "F8924B5C-7160-4BC3-A0E6-EA452F3E5C18"
license = false
eula = false

[dependencies]
analog-core.workspace = true
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
env_logger.workspace = true
log.workspace = true
serde_json = "1.0.154"

[features]
# Camera RAW input. On by default so the CLI opens RAW files; needs a C++
# compiler. Disable with `--no-default-features` for a pure-Rust build.
default = ["raw"]
raw = ["analog-core/raw"]
