[package]
name = "analog-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
repository = "https://github.com/apanoush/analog"

[package.metadata.wix]
upgrade-guid = "77D130DD-2A01-44C8-9658-6882E8FB8522"
path-guid = "1026A0AE-5CBB-4A0D-8D48-3741081E3710"
license = false
eula = false

[dependencies]
analog-core.workspace = true
env_logger.workspace = true
iced = { version = "0.14.0", features = ["image", "tokio", "canvas"] }
log.workspace = true
rfd = "0.17.2"

[features]
# Camera RAW input. On by default so the editor opens RAW files; needs a C++
# compiler. Disable with `--no-default-features` for a pure-Rust build.
default = ["raw"]
raw = ["analog-core/raw"]
